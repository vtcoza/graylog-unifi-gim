[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graylog-unifi-gim"
version = "0.1.0"
description = "Regression tooling and content-pack builder for Graylog UniFi GIM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "jsonschema>=4.23"]

[project.scripts]
unifi-gim = "graylog_unifi_gim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
