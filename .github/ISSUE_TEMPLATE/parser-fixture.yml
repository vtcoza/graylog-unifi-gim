name: Parser fixture
description: Contribute a sanitized raw UniFi parser signature.
title: "[fixture] "
labels: [parser, fixture]
body:
  - type: dropdown
    id: format
    attributes:
      label: Format
      options: [CEF, Device syslog, Malformed]
    validations: {required: true}
  - type: input
    id: firmware
    attributes: {label: Product and firmware}
    validations: {required: true}
  - type: textarea
    id: message
    attributes:
      label: Sanitized raw message
      description: Use documentation IPs, locally administered MACs, and fictional names.
      render: text
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed production hostnames, aliases, site codes, IPs, and MACs.
          required: true

